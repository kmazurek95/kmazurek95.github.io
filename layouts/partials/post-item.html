<li class="post-item">
  {{ if not .Date.IsZero }}<time class="post-date">{{ .Date.Format "Jan 2006" }}</time>{{ end }}
  <div>
    <div class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Params.type }} <span class="tag">{{ . }}</span>{{ end }}</div>
    {{ with .Params.summary }}<p class="post-excerpt">{{ . }}</p>{{ end }}
  </div>
</li>
